<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Story Bank — simpan dan baca kembali koleksi cerita pribadi.">
  <title>Story Bank</title>
  <script src="../auth-guard.js?v=1"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../bank-mobile.css?v=4">
  <script src="../bank-mobile.js?v=2" defer></script>
</head>
<body>
  <div class="app-window">
    <header class="titlebar">
      <a class="brand" href="../index.html"><span class="app-icon">S</span><strong>Story Bank</strong></a>
      <div class="header-actions"><a class="xp-button" href="../index.html">⌂ Hub</a><button class="xp-button primary" id="addStoryButton" type="button">＋ Tambah cerita</button></div>
    </header>
    <div class="summary"><span><b id="storyCount">0</b> cerita</span><span><b id="categoryCount">0</b> kategori</span></div>
    <main>
      <div class="section-title"><h1>Koleksi Cerita</h1></div>
      <div class="toolbar">
        <label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Cari judul cerita..." autocomplete="off"></label>
        <select id="categoryFilter"><option value="">Semua kategori</option></select>
        <select id="sortSelect"><option value="newest">Terbaru</option><option value="oldest">Terlama</option><option value="az">A–Z</option></select>
        <button class="xp-button" id="exportButton" type="button">Ekspor</button>
        <button class="xp-button" id="importButton" type="button">Impor</button>
        <input id="importInput" type="file" accept="application/json,.json" hidden>
      </div>
      <section id="storyGrid" class="story-grid" aria-live="polite"></section>
      <section id="emptyState" class="empty-state" hidden><div>✎</div><h2>Belum ada cerita</h2><p>Tambahkan cerita pertama untuk memulai koleksi.</p></section>
    </main>
  </div>

  <dialog id="formDialog">
    <form id="storyForm" novalidate autocomplete="off">
      <div class="dialog-title"><strong id="formTitle">Tambah cerita</strong><button class="close" type="button" data-close="formDialog">×</button></div>
      <input id="editId" type="hidden">
      <label class="field"><span>Judul <b>*</b></span><input id="titleInput" maxlength="160" required placeholder="Judul cerita"><small id="titleError"></small></label>
      <label class="field"><span>Kategori <i>opsional</i></span><input id="categoryInput" maxlength="60" list="categorySuggestions" autocomplete="off" placeholder="Contoh: Refleksi"><datalist id="categorySuggestions"></datalist></label>
      <label class="field"><span>Cerita <b>*</b></span><textarea id="contentInput" rows="13" maxlength="50000" required placeholder="Tulis cerita lengkap di sini..."></textarea><small id="contentError"></small></label>
      <div class="dialog-actions"><button class="xp-button" type="button" data-close="formDialog">Batal</button><button class="xp-button primary" type="submit">Simpan cerita</button></div>
    </form>
  </dialog>

  <dialog id="readerDialog" class="reader-dialog">
    <article>
      <div class="dialog-title"><strong>Story Reader</strong><button class="close" type="button" data-close="readerDialog">×</button></div>
      <div class="reader-body"><p id="readerCategory" class="category-label"></p><h2 id="readerTitle"></h2><time id="readerDate"></time><div id="readerContent" class="reader-content"></div></div>
      <div class="dialog-actions reader-actions"><button class="xp-button danger" id="deleteStoryButton" type="button">Hapus</button><button class="xp-button" id="editStoryButton" type="button">Edit</button><button class="xp-button primary" type="button" data-close="readerDialog">Tutup</button></div>
    </article>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="../supabase-config.js?v=1"></script><script src="../cloud-sync.js?v=1"></script><script src="../system-language.js?v=1"></script>
  <script src="script.js?v=1"></script>
</body>
</html>
